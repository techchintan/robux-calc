        crossorigin="anonymous"></script>

</head>

<body>
    <section>
        <main>
            <div class="bg-top"></div>
            <div class="bg-bottom"></div>
            <div class="main_div">
                <div class="fff_game_section">

                    <div class="header">
                        <img src="assets/robux/back.webp" alt="Back" class="back-button" id="backButton">
                        <h1 class="home-title">Spin Wheel</h1>
                    </div>

                    <div class="gadsbanner" id="adsense-container">
                        <ins class="adsbygoogle" id="adsense-slot" style="display:block"
                            data-ad-client="ca-pub-7178919035426667" data-ad-slot="1473464117"
                            data-ad-format="auto"></ins>
                        <script>
                            (adsbygoogle = window.adsbygoogle || []).push({});
                        </script>
                    </div>

                    <div class="game_section" style="height: auto">
                        <canvas id="wheel"></canvas>
                        <button id="spin-btn">Spin</button>
                        <img class="imgspin" src="assets/robux/iv_weel_point.png" alt="spinner arrow" />
                    </div>
                    <div id="final-value">
                        <p>Click On The Spin Button To Start</p>
                    </div>

                    <!-- Win Coins Popup Dialog -->
                    <div id="dialogBox" class="dialog-overlay hidden">
                        <div class="dialog-box">
                            <img src="assets/robux/skiff_cong.webp" alt="Congratulations" class="dialog-icon">
                            <h2 id="dialogTitle"
                                style="color: #ff7655; font-size: 22px; font-weight: bold; margin: 10px 0;">
                                Congratulations!</h2>
                            <p class="countryP" id="winCoinsMsg"
                                style="color: #333; font-size: 17px; margin: 10px 0 20px; font-weight: 600;">You won 0
                                Coins!</p>
                            <a href="home.html" id="claimWinBtn" style="display: block; text-decoration: none;">
                                <img src="assets/robux/skiff_okbtn.png" class="dialog-button" alt="OK"
                                    style="cursor: pointer; max-width: 220px; margin: 0 auto; display: block;">
                            </a>
                        </div>
                    </div>
                </div>
            </div>

        </main>
    </section>

    <!-- Chart JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
    <!-- Chart JS Plugin for displaying text over chart -->
    <script
        src="https://cdnjs.cloudflare.com/ajax/libs/chartjs-plugin-datalabels/2.1.0/chartjs-plugin-datalabels.min.js">
        </script>
    <!-- Script -->
    <script>
        const wheel = document.getElementById("wheel");
        const spinBtn = document.getElementById("spin-btn");
        const finalValue = document.getElementById("final-value");
        //Object that stores values of minimum and maximum angle for a value
        const rotationValues = [{
            minDegree: 0,
            maxDegree: 30,
            value: 0
        },
        {
            minDegree: 31,
            maxDegree: 90,
            value: "20 Rewards"
        },
        {
            minDegree: 91,
            maxDegree: 150,
            value: "120 Rewards"
        },
        {
            minDegree: 151,
            maxDegree: 210,
            value: "100 Rewards"
        },
        {
            minDegree: 211,
            maxDegree: 270,
            value: "80 Rewards"
        },
        {
            minDegree: 271,
            maxDegree: 330,
            value: "60 Rewards"
        },
        {
            minDegree: 331,
            maxDegree: 360,
            value: "40 Rewards"
        },
        ];
        //Size of each piece
        const data = [16, 16, 16, 16, 16, 16];
        //background color for each piece
        var pieColors = [
            "#DA0000",
            "#DA00B4",
            "#63ADB9",
            "#528820",
            "#95D952",
            "#E69423    ",
        ];
        //Create chart
        let myChart = new Chart(wheel, {
            //Plugin for displaying text on pie chart
            plugins: [ChartDataLabels],
            //Chart Type Pie
            type: "pie",
            data: {
                //Labels(values which are to be displayed on chart)
                labels: [20, 40, 60, 80, 100, 120],
                //Settings for dataset/pie
                datasets: [{
                    backgroundColor: pieColors,
                    data: data,
                },],
            },
            options: {
                //Responsive chart
                responsive: true,
                animation: {
                    duration: 0
                },
                plugins: {
                    //hide tooltip and legend
                    tooltip: false,
                    legend: {
                        display: false,
                    },
                    //display labels inside pie chart
                    datalabels: {
                        color: "#ffffff",
                        formatter: (_, context) => context.chart.data.labels[context.dataIndex],
                        font: {
                            size: 24
                        },
                    },
                },
            },
        });
        //display value based on the randomAngle
        const valueGenerator = (angleValue) => {
            for (let i of rotationValues) {
                //if the angleValue is between min and max then display it
                if (angleValue >= i.minDegree && angleValue <= i.maxDegree) {
                    const coinsWon = parseInt(i.value, 10) || 0;

                    // Calculate and add won coins to localStorage
                    try {
                        let currentCoins = parseInt(localStorage.getItem("coins") || "0", 10) || 0;
                        currentCoins += coinsWon;
                        localStorage.setItem("coins", currentCoins.toString());
                    } catch (e) {
                        console.error("Error updating coins:", e);
                    }

                    // Reset status text under wheel
                    finalValue.innerHTML = `<p>Spin Completed!</p>`;

                    // Show Win Coins Popup after a short delay so user can see where the wheel stopped
                    setTimeout(() => {
                        const dialogBox = document.getElementById("dialogBox");
                        const dialogTitle = document.getElementById("dialogTitle");
                        const winCoinsMsg = document.getElementById("winCoinsMsg");

                        if (coinsWon > 0) {
                            dialogTitle.textContent = "Congratulations!";
                            winCoinsMsg.innerHTML = `You won <span style="color: #4caf50; font-size: 22px; font-weight: bold;">${coinsWon}</span> Coins!`;
                        } else {
                            dialogTitle.textContent = "Better Luck Next Time!";
                            winCoinsMsg.textContent = "You won 0 Coins!";
                        }

                        dialogBox.classList.remove("hidden");
                    }, 1200);
                    break;
                }
            }
        };

        // Click on popup OK button redirects directly to home.html
        document.getElementById("claimWinBtn").addEventListener("click", function (e) {
            e.preventDefault();
            window.location.href = "home.html";
        });

        //Spinner count
        let count = 0;
        //100 rotations for animation and last rotation for result
        let resultValue = 101;
        let isFirstSpin = true;

        //Start spinning
        spinBtn.addEventListener("click", () => {
            // First spin was paid on entry from home (10 coins). If user spins again, verify & deduct 10 coins
            if (!isFirstSpin) {
                let currentCoins = parseInt(localStorage.getItem("coins") || "0", 10) || 0;
                if (currentCoins < 10) {
                    finalValue.innerHTML = `<p style="color:#ff6b6b;font-weight:600;">You need 10 Coins to spin again!</p>`;
                    return;
                }
                currentCoins -= 10;
                localStorage.setItem("coins", currentCoins.toString());
            }
            isFirstSpin = false;

            spinBtn.disabled = true;
            //Empty final value
            finalValue.innerHTML = `<p>Good Luck!</p>`;
            //Generate random degrees to stop at
            let randomDegree = Math.floor(Math.random() * (355 - 0 + 1) + 0);
            //Interval for rotation animation
            let rotationInterval = window.setInterval(() => {
                //Set rotation for piechart
                /*
                Initially to make the piechart rotate faster we set resultValue to 101 so it rotates 101 degrees at a time and this reduces by 1 with every count. Eventually on last rotation we rotate by 1 degree at a time.
                */
                myChart.options.rotation = myChart.options.rotation + resultValue;
                //Update chart with new value;
                myChart.update();
                //If rotation>360 reset it back to 0
                if (myChart.options.rotation >= 360) {
                    count += 1;
                    resultValue -= 5;
                    myChart.options.rotation = 0;
                } else if (count > 15 && myChart.options.rotation == randomDegree) {
                    valueGenerator(randomDegree);
                    clearInterval(rotationInterval);
                    count = 0;
                    resultValue = 101;
                }
            }, 10);
        });
    </script>

    <script>
        document.getElementById("backButton").addEventListener("click", function () {
            window.history.back();
        });


    </script>

    <script src="js/analytics.js"></script>
</body>
