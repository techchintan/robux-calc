<body>


    <section>
        <main>
            <div class="bg-top"></div>
            <div class="bg-bottom"></div>
            <div class="main_div">
                <div class="fff_game_section">

                    <div class="header" style="justify-content: space-between;">
                        <div style="display: flex; align-items: center;">
                            <img src="assets/robux/back.webp" alt="Back" class="back-button" id="backButton">
                            <h1 class="home-title">Dollar to RBX Calculator</h1>
                        </div>
                        <div class="redeem-coin" style="margin-right: 20px;">
                            <img src="assets/icons/coin-earn.png" alt="" style="width: 24px; height: 24px;" />
                            <span id="coin">0</span>
                        </div>
                    </div>

                    <div class="game_section" style="height: auto">
                        <div>
                            <img src="assets/robux/all_calimage.webp" class="rbximage">
                        </div>
                        <div>
                            <input type="text" class="input-field" id="playerNameInput"
                                placeholder="Enter Dollar Amount">
                            <br>
                            <button class="continue-btn" id="continueBtn">Count Now</button>
                        </div>
                    </div>

                    <div id="rbxbuilder">
                        <div type="text">
                            Getting this much of Dollars will cost :
                        </div>
                        <div id="result" class="rbxresult"></div>
                    </div>

                    <!-- <div class="gadsbanner" id="adsense-container">
                        <ins class="adsbygoogle" id="adsense-slot" style="display:block"

                </div>

            </div>
            </div>

        </main>
    </section>

    <script>
        function updateCoinsDisplay() {
            try {
                const userCoins = parseInt(localStorage.getItem("coins") || "0", 10) || 0;
                const coinEl = document.getElementById("coin");
                if (coinEl) coinEl.textContent = userCoins;
            } catch (e) { }
        }
        document.addEventListener("DOMContentLoaded", updateCoinsDisplay);
        window.addEventListener("pageshow", updateCoinsDisplay);

        document.getElementById("backButton").addEventListener("click", function () {
            window.history.back();
        });

        document.getElementById("continueBtn").addEventListener("click", function () {
            const rbx = parseInt(document.getElementById("playerNameInput").value, 10);

            if (!isNaN(rbx) && rbx > 0) {
                // Conversion: 1 RBX = $0.0125
                const total = rbx * 80;

                // Show result
                document.getElementById("result").innerText = total.toFixed(2) + " RBX";
                document.getElementById("rbxbuilder").style.display = "block";
            } else {
                alert("Please enter the dollar amount");
            }
        });
    </script>

    <script src="js/analytics.js"></script>
