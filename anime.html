    <script>
        document.getElementById("backButton").addEventListener("click", function () {
            window.history.back();
        });

        document.querySelectorAll("a[data-anime]").forEach(function(link) {
            link.addEventListener("click", function() {
                localStorage.setItem("selectedAnime", this.getAttribute("data-anime"));
            });
        });
    </script>

    <script src="js/analytics.js"></script>

    <script>
        let clickedGameUrl = null;

        /* ---------------- GAME SECTION CLICK ---------------- */
        document.querySelectorAll(".earnCoinSection").forEach((section) => {
            section.addEventListener("click", function (e) {
                e.preventDefault();
                clickedGameUrl = this.querySelector("a").href;
                showToastCountdown(7);
                startRewardAdFlow();
            });
        });

        function startRewardAdFlow() {
            if (adLoading) return;
            adLoading = true;

            showAdWithLogic((result) => {
                if (clickedGameUrl) setTimeout(() => (window.location.href = clickedGameUrl), 100);
                adLoading = false;
            });
        }

        function showToastCountdown(seconds) {
            let toast = document.createElement("div");
            toast.className = "timer-toast-message show";
            let msg = document.createElement("span");
            msg.textContent = `Wait ${seconds}s...`;
            toast.innerHTML = `<img src="assets/icons/clock.png" alt="" style="width:20px;height:20px;margin-right:8px;">`;
            toast.appendChild(msg);
            document.body.appendChild(toast);
            let count = seconds;
            let timer = setInterval(() => {
                count--;
                msg.textContent = `Wait ${count}s...`;
                if (count <= 0) {
                    clearInterval(timer);
                    toast.remove();
                }
            }, 1000);
        }
    </script>
