    <script>
        document.getElementById("backButton").addEventListener("click", function () {
            window.history.back();
        });


        /* ---------------- PAGE LOAD: INIT COINS ---------------- */
        function updateHomeCoins() {
            const userCoins = parseInt(safeGetItem("coins")) || 0;
            const coinEl = document.getElementById("coin");
            if (coinEl) coinEl.textContent = userCoins;
        }
        document.addEventListener("DOMContentLoaded", updateHomeCoins);
        window.addEventListener("pageshow", updateHomeCoins);

        /* ---------------- SAFE LOCALSTORAGE HELPERS ---------------- */
        function safeGetItem(key) {
            try { return localStorage.getItem(key); } catch (e) { return null; }
        }

        function safeSetItem(key, value) {
            try { localStorage.setItem(key, value); } catch (e) { }
        }

        /* ---------------- AD INITIALIZER ---------------- */
        // Removed local initializeAds as it's now handled by showAdWithLogic in analytics.js

        let clickedGameUrl = null;

        document.getElementById("earnCoinBtn").addEventListener("click", function () {
            if (adLoading) return;
            const earnBtn = document.getElementById("earnCoinBtn");
            const originalText = earnBtn.innerHTML;
            earnBtn.innerHTML = "Loading Ad... ⏳";
            earnBtn.disabled = true;
            adLoading = true;

            showAdWithLogic((placementInfo) => {
                if (placementInfo && placementInfo.breakStatus === "viewed") {
                    addCoins(10);
                    showToast();
                }
                earnBtn.innerHTML = originalText;
                earnBtn.disabled = false;
                adLoading = false;
            });
        });

        function showToast() {
            let toast = document.getElementById("toast");
            if (!toast) {
                toast = document.createElement("div");
                toast.id = "toast";
                toast.className = "toast-message";
                toast.innerHTML = `<img src="assets/icons/correct.png" alt="" style="width:20px;height:20px;margin-right:8px;">You've received 10 coins`;
                document.body.appendChild(toast);
            }
            toast.classList.add("show");
            setTimeout(() => toast.classList.remove("show"), 5000);
        }

        function ErrorToast() {
            let toast = document.getElementById("toast");
            if (!toast) {
                toast = document.createElement("div");
                toast.id = "toast";
                toast.className = "toast-message";
                toast.innerHTML = `❌ Ad not available, try again later`;
                document.body.appendChild(toast);
            }
            toast.classList.add("show");
            setTimeout(() => toast.classList.remove("show"), 5000);
        }

        function addCoins(amount) {
            let coins = parseInt(safeGetItem("coins")) || 0;
            coins += amount;
            safeSetItem("coins", coins);
            document.getElementById("coin").textContent = coins;
        }

        // Updated earnCoin_section2 to use showAdWithLogic if coins are low
        document.querySelectorAll(".earnCoin_section2").forEach((section) => {
            section.addEventListener("click", function (e) {
                e.preventDefault();
                e.stopPropagation();
                const userCoins = parseInt(safeGetItem("coins")) || 0;
                const requiredCoins = 10;
                const link = this.querySelector("a");
                clickedGameUrl = link ? link.href : null;
                if (!clickedGameUrl) return;

                if (userCoins < requiredCoins) {
                    showOopsPopup();
                } else {
                    const updatedCoins = userCoins - requiredCoins;
                    safeSetItem("coins", updatedCoins);
                    document.getElementById("coin").textContent = updatedCoins;
                    window.location.href = clickedGameUrl;
                }
            });
        });

        function showOopsPopup() {
            const existingPopup = document.getElementById("oopsPopup");
            if (existingPopup) existingPopup.remove();
            const popupHTML = `
    <div id="oopsPopup" class="popup" style="display:flex" data-clarity-mask="true">
      <div class="popup-data">
        <img class="oops-img" src="assets/icons/oops.png" alt="Oops!" />
        <p class="main-text">You don't have enough coins to join this contest.</p>
        <p class="sub-text">Watch an ad to earn free coins</p>
        <div class="watch-btn-wrapper">
          <button id="watchAdBtn" class="watch-btn shimmer-btn">Watch Video</button>
          <span class="ad-tag">Ad</span>
        </div>
        <button id="skipBtn" class="skip-btn">close</button>
      </div>
    </div>`;
            const wrapper = document.createElement("div");
            wrapper.innerHTML = popupHTML;
            document.body.appendChild(wrapper.firstElementChild);
            const watchBtn = document.getElementById("watchAdBtn");
            const skipBtn = document.getElementById("skipBtn");
            const originalText = watchBtn.innerHTML;
            skipBtn.addEventListener("click", () => document.getElementById("oopsPopup").remove());
            watchBtn.addEventListener("click", function () {
                watchBtn.innerHTML = "Loading Ad... ⏳";
                watchBtn.disabled = true;
                skipBtn.disabled = true;

                showAdWithLogic((result) => {
                    if (result && result.breakStatus === "viewed") {
                        if (clickedGameUrl) setTimeout(() => (window.location.href = clickedGameUrl), 100);
                    } else {
                        if (clickedGameUrl) setTimeout(() => (window.location.href = clickedGameUrl), 100);
                    }
                    document.getElementById("oopsPopup").remove();
                    watchBtn.innerHTML = originalText;
                    watchBtn.disabled = false;
                    skipBtn.disabled = false;
                });
            });
        }

        document.querySelectorAll(".earnCoinSection").forEach((section) => {
            section.addEventListener("click", function (e) {
                e.preventDefault();
                clickedGameUrl = this.querySelector("a").href;
                showToastCountdown(7);
                startRewardAdFlow();
            });
        });

        function startRewardAdFlow() {
            if (adLoading) return;
            adLoading = true;
            showAdWithLogic((result) => {
                if (clickedGameUrl) setTimeout(() => (window.location.href = clickedGameUrl), 100);
                adLoading = false;
            });
        }

        function showToastCountdown(seconds) {
            let toast = document.createElement("div");
            toast.className = "timer-toast-message show";
            let msg = document.createElement("span");
            msg.textContent = `Wait ${seconds}s...`;
            toast.innerHTML = `<img src="assets/icons/clock.png" alt="" style="width:20px;height:20px;margin-right:8px;">`;
            toast.appendChild(msg);
            document.body.appendChild(toast);
            let count = seconds;
            let timer = setInterval(() => {
                count--;
                msg.textContent = `Wait ${count}s...`;
                if (count <= 0) {
                    clearInterval(timer);
                    toast.remove();
                }
            }, 1000);
        }
    </script>
